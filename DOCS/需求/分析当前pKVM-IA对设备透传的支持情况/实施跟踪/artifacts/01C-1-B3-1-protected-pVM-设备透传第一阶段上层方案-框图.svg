<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180">
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9ecef" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d6dbe1" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f3640"/>
    </marker>
    <style>
      .layer { fill: #ffffff; stroke: #2f3640; stroke-width: 3; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Noto Sans SC", sans-serif; fill: #2f3640; }
      .title { font-size: 28px; font-weight: 500; text-anchor: middle; }
      .body { font-size: 18px; }
      .arrow { stroke: #2f3640; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .fallback { stroke: #4b5563; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .flow-text { font-family: Arial, "Noto Sans CJK SC", "Noto Sans SC", sans-serif; font-size: 16px; fill: #374151; }
      .legend { font-family: Arial, "Noto Sans CJK SC", "Noto Sans SC", sans-serif; font-size: 15px; fill: #374151; }
    </style>
  </defs>

  <rect width="2000" height="1180" fill="#ffffff"/>
  <rect width="2000" height="1180" fill="url(#grid)"/>

  <rect class="layer" x="120" y="60" width="980" height="240"/>
  <rect class="layer" x="120" y="420" width="900" height="240"/>
  <rect class="layer" x="1280" y="420" width="620" height="300"/>
  <rect class="layer" x="120" y="800" width="1780" height="300"/>

  <text class="label title" x="610" y="180">Host userspace</text>
  <text class="label body" x="185" y="235">
    <tspan x="185" dy="0">- crosvm / VFIO userspace</tspan>
    <tspan x="185" dy="30">- 发现 passthrough 设备并决定 attach</tspan>
    <tspan x="185" dy="30">- 通过 KVM_ENABLE_CAP ioctl 提交 ptdev metadata 子操作</tspan>
    <tspan x="185" dy="30">- 准备用户态 BDF / BAR / MMIO metadata</tspan>
  </text>

  <text class="label title" x="570" y="545">Host kernel</text>
  <text class="label body" x="185" y="595">
    <tspan x="185" dy="0">- KVM ioctl 路径: pkvm_vm_ioctl_set_ptdev_mmio_metadata()</tspan>
    <tspan x="185" dy="30">- copy_from_user / 本地校验 / host-side metadata 暂存</tspan>
    <tspan x="185" dy="30">- pkvm_hypercall(sync_ptdev_mmio_metadata, ...) 进入 hyp</tspan>
    <tspan x="185" dy="30">- 承接 host side trap / exit handling</tspan>
  </text>

  <text class="label title" x="1590" y="560">protected pVM</text>
  <text class="label body" x="1345" y="610">
    <tspan x="1345" dy="0">- PCI config 枚举继续走 emulated path</tspan>
    <tspan x="1345" dy="30">- pkvm_virt_mmio() 作为统一 MMIO 入口</tspan>
    <tspan x="1345" dy="30">- DIRECT_BAR 命中后 raw_read/raw_write 直达普通 BAR</tspan>
    <tspan x="1345" dy="30">- 未命中时退回 PKVM_GHC_IOREAD / IOWRITE</tspan>
  </text>

  <text class="label title" x="1010" y="945">pKVM / hyp</text>
  <text class="label body" x="185" y="995">
    <tspan x="185" dy="0">- attach 边界决定 accept / reject</tspan>
    <tspan x="185" dy="30">- 持有 authoritative BAR/MMIO metadata</tspan>
    <tspan x="185" dy="30">- 发布 direct BAR allowlist / guest contract</tspan>
    <tspan x="185" dy="30">- 将 fallback hypercall / emulation 请求转回 host</tspan>
  </text>

  <line class="arrow" x1="420" y1="300" x2="420" y2="420"/>
  <text class="flow-text" x="445" y="340">KVM_ENABLE_CAP ioctl</text>
  <text class="flow-text" x="445" y="365">cap=KVM_CAP_X86_PROTECTED_VM</text>
  <text class="flow-text" x="445" y="390">flags=SET_PTDEV_MMIO_METADATA</text>

  <line class="arrow" x1="420" y1="660" x2="420" y2="800"/>
  <text class="flow-text" x="450" y="692">host kernel -&gt; hyp</text>
  <text class="flow-text" x="450" y="717">sync_ptdev_mmio_metadata</text>
  <text class="flow-text" x="450" y="742">candidate BAR/MMIO metadata</text>

  <line class="arrow" x1="1540" y1="800" x2="1540" y2="720"/>
  <text class="flow-text" x="1295" y="752">publish authoritative metadata</text>
  <text class="flow-text" x="1335" y="775">direct BAR allowlist / contract</text>

  <line class="fallback" x1="1665" y1="720" x2="1665" y2="800"/>
  <text class="flow-text" x="1695" y="742">fallback hypercall</text>
  <text class="flow-text" x="1695" y="765">metadata lookup</text>

  <line class="fallback" x1="920" y1="800" x2="920" y2="660"/>
  <text class="flow-text" x="950" y="705">forward emulation request</text>
  <text class="flow-text" x="950" y="730">VM-exit / trap handling</text>

  <line class="fallback" x1="920" y1="420" x2="920" y2="300"/>
  <text class="flow-text" x="950" y="352">userspace MMIO / config emulation</text>

  <rect x="1460" y="820" width="360" height="110" fill="#ffffff" stroke="#9aa3af" stroke-width="2"/>
  <line x1="1490" y1="855" x2="1560" y2="855" class="arrow"/>
  <text class="legend" x="1580" y="861">实线：初始化 / control / metadata</text>
  <line x1="1490" y1="895" x2="1560" y2="895" class="fallback"/>
  <text class="legend" x="1580" y="901">虚线：运行期 fallback / emulation</text>
</svg>
