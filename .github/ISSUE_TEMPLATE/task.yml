name: Task
description: 用于跟踪一个实现阶段、归因任务或明确的工程动作
title: "[TASK] "
labels:
  - type/task
body:
  - type: markdown
    attributes:
      value: |
        规则：
        - Task 用来表达“要完成什么”，不要把多个不同签名的问题混在一个 Task 里。
        - 若 Task 被某个具体 panic/报错阻塞，请链接对应 Bug issue。
        - Task 一旦标记为进行中，正文里必须已经写清楚修复方案摘要；若已有完整方案设计，请附本地 `DOCS/...` 文档链接。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - area/pkvm-hyp
        - area/pkvm-core
        - area/crosvm
        - area/vfio
        - area/docs
        - area/automation
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - prio/b0
        - prio/p0
        - prio/p1
        - prio/p2
    validations:
      required: true
  - type: input
    id: goal
    attributes:
      label: 目标
      placeholder: 例如 T2 pgstate_pgt 语义收敛为 DMA mirror
    validations:
      required: true
  - type: textarea
    id: current_state
    attributes:
      label: 当前表现 / 当前阻塞
      description: 先用 2-5 行写清楚现在卡在哪里、最直接的现象是什么
      placeholder: |
        - 当前现象：
        - 当前阻塞：
        - 为什么现在要做这个 Task：
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景与上下文
      placeholder: 简述为什么要做、当前依赖和前置结论
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 修复方案摘要 / 本地方案文档
      description: GitHub 中保留可执行摘要；若已有完整方案设计，请附本地 `DOCS/...` 文档路径或链接
      placeholder: |
        - 方案摘要：
        - 关键改动点：
        - 为什么这样改：
        - 这轮明确不做什么：
        - 本地方案文档：
    validations:
      required: true
  - type: textarea
    id: source_anchors
    attributes:
      label: 关键源码锚点
      placeholder: |
        - pKVM-IA/...
        - crosvm/...
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: 预期输出
      placeholder: 代码、文档、结论或验证结果
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验收标准
      placeholder: 完成到什么程度才算关闭
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖 / 阻塞
      placeholder: 关联 issue、PR 或外部条件
